<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Marea OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--ab:#0e2433;--os:#1f5f7a;--es:#d9efe8;--ar:#e8d9b5;--co:#ff6b57;--b1:#ff9a62;--b2:#2a1b4a;--w1:#e8556d;--w2:#7a2f6b;--w3:#2a1b4a;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ab:#0e2433}}
:root[data-theme="dark"]{--ab:#0e2433}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ab);font-family:var(--f);color:var(--es);user-select:none}
button{font-family:inherit}:focus-visible{outline:2px solid var(--co);outline-offset:2px}
#boot,#login,#off{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--ab);z-index:999;text-align:center}
#login,#off{display:none}#boot svg,#login svg{width:96px;height:96px}
#boot h1{margin:0;font-weight:800;font-size:34px;letter-spacing:.5px}
.pb{width:220px;height:6px;border-radius:6px;background:#ffffff22;overflow:hidden}.pb i{display:block;height:100%;background:var(--co);animation:pb 2.4s ease-out forwards}
@keyframes pb{from{width:0}to{width:100%}}
#boot svg{animation:rise 2.2s ease-out}@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#log{font:12px/1.6 var(--m);color:#9fc5c0;text-align:left;min-height:100px;margin:0}
#login input{background:#ffffff18;border:1px solid #fff4;border-radius:12px;padding:10px 14px;color:var(--es);font:inherit;text-align:center}
.pr{background:var(--co);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
#desk{position:fixed;inset:0;background:linear-gradient(var(--b1),var(--b2));display:none;overflow:hidden}
.wp{position:absolute;bottom:0;left:0;width:100%;height:55%}
.sun{position:absolute;top:16%;right:14%;width:18vmin;height:18vmin;border-radius:50%;background:#fff5}
#icons{position:absolute;inset:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:92px;align-content:start}
.ic{width:84px;text-align:center;font-size:12px;padding:6px;border-radius:10px;cursor:pointer;color:#fff;text-shadow:0 1px 4px #0008;background:none;border:0}
.ic svg{width:48px;height:48px;display:block;margin:0 auto 4px}.ic:hover,.ic:focus{background:#ffffff2a}
#dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:24px;background:#0e2433d0;backdrop-filter:blur(14px);z-index:900;max-width:calc(100% - 16px)}
#dock svg{width:36px;height:36px;display:block}#tasks{display:flex;gap:4px}
.tk,#sb{background:none;border:0;border-radius:12px;padding:3px;cursor:pointer;opacity:.75;position:relative}.tk.on{opacity:1;background:#ffffff22}.tk:hover,#sb:hover{opacity:1}
#clk{font-size:13px;padding:0 6px;font-weight:600}
#menu{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:270px;padding:8px;border-radius:18px;background:#0e2433ee;backdrop-filter:blur(16px);z-index:950;display:none;border:1px solid #fff2}
#menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px;border:0;border-radius:10px;background:none;color:var(--es);font-size:14px;cursor:pointer;text-align:left}
#menu button:hover{background:#ffffff1c}#menu svg{width:30px;height:30px}#menu hr{border:0;border-top:1px solid #fff2;margin:6px 0}
.win{position:absolute;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#12303f;box-shadow:0 10px 30px #0006;border:1px solid #ffffff22;resize:both;min-width:260px;min-height:170px}
.win.on{box-shadow:0 18px 50px #000a;border-color:#ff6b5799}.win.min{display:none}
.win.max{inset:0 0 70px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.tb{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ab);cursor:grab;touch-action:none}
.tb i svg{width:20px;height:20px;display:block}.tb b{flex:1;font-weight:600;font-size:13px}
.tb button{width:26px;height:24px;border:0;border-radius:7px;background:#ffffff14;color:var(--es);cursor:pointer}.tb button:hover{background:var(--co)}
.bd{flex:1;overflow:auto;display:flex;flex-direction:column;user-select:text;min-height:0}
.term{display:block;background:#071820;font:13px/1.5 var(--m);padding:10px;color:#9ff5d6}.term div{white-space:pre-wrap}
.term .row{display:flex;gap:6px}.term input{flex:1;background:none;border:0;color:#fff;font:inherit;outline:0}
.notes{padding:8px;gap:8px}.notes input,.notes textarea,.set input{background:var(--ab);color:var(--es);border:1px solid #fff3;border-radius:8px;padding:8px;font:inherit}
.notes textarea{flex:1;resize:none;font-family:var(--m)}
.bd.files{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px;padding:10px;align-content:start}
.fl{position:relative;text-align:center;font-size:12px;padding:8px 4px;border-radius:10px;cursor:pointer;word-break:break-all}.fl:hover{background:#ffffff1a}.fl svg{width:40px;height:40px}
.fl u{position:absolute;top:2px;right:4px;text-decoration:none;opacity:0;font-size:11px}.fl:hover u{opacity:1}
.calc{padding:10px;gap:8px}.calc output{background:var(--ab);border-radius:10px;padding:12px;text-align:right;font:24px var(--m);overflow:hidden}
.pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pad button{background:var(--os);color:#fff;border:0;border-radius:10px;font:600 18px var(--f);cursor:pointer}.pad button:hover{filter:brightness(1.25)}
.paint{padding:8px;gap:8px}.paint canvas{flex:1;min-height:0;width:100%;background:#fff;border-radius:8px;touch-action:none;cursor:crosshair}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff6;cursor:pointer}
.snake{align-items:center;justify-content:center;gap:6px;padding:8px}.snake canvas{max-width:100%;max-height:calc(100% - 28px);aspect-ratio:1;background:#071820;border-radius:8px}
.set{padding:14px;gap:12px}.set label{display:grid;gap:4px}.set p{margin:0}.th{display:flex;gap:8px}.th button{width:46px;height:46px;border-radius:12px;border:2px solid #fff6;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="boot"><div id="bl"></div><h1>Marea OS</h1><div class="pb"><i></i></div><pre id="log"></pre></div>
<div id="login"><div id="ll"></div><h2 style="margin:0">Bienvenido a bordo</h2><input id="un" aria-label="Tu nombre" maxlength="20"><button class="pr" id="go">Entrar</button></div>
<div id="off"><button class="pr" id="on">Encender Marea OS</button></div>
<div id="desk">
<div class="sun"></div>
<svg class="wp" viewBox="0 0 1200 400" preserveAspectRatio="none"><path style="fill:var(--w1)" d="M0 120C200 40 350 200 600 120S1000 40 1200 110V400H0Z"/><path style="fill:var(--w2)" d="M0 200C250 130 400 280 650 200S1000 140 1200 200V400H0Z"/><path style="fill:var(--w3)" d="M0 290C220 240 420 340 700 280S1050 250 1200 290V400H0Z"/></svg>
<div id="icons"></div>
<div id="menu"></div>
<div id="dock"><button id="sb" title="Menú de Marea"></button><div id="tasks"></div><span id="clk"></span></div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s),H=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sv=(k,v)=>{try{localStorage.setItem('marea.'+k,JSON.stringify(v))}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem('marea.'+k);return v?JSON.parse(v):d}catch(e){return d}};
let fs=ld('fs',{'bienvenida.txt':'Bienvenido a Marea OS.\nTodo este sistema vive en un solo archivo.\nPrueba la Terminal y escribe “ayuda”.'}),cfg=ld('cfg',{user:'invitado',theme:0});
const fsev=()=>document.dispatchEvent(new Event('fs'));
const TH=[['#ff9a62','#2a1b4a','#e8556d','#7a2f6b','#2a1b4a'],['#9fe3df','#0e5a73','#2a8aa0','#1f5f7a','#0e2433'],['#16254a','#050912','#1f3a6b','#142a52','#0a1530'],['#f7e6bf','#d6a76a','#e2b878','#c98f5a','#8a5a3a']];
const setTheme=i=>{const t=TH[i],s=document.documentElement.style;['--b1','--b2','--w1','--w2','--w3'].forEach((v,j)=>s.setProperty(v,t[j]))};
const dots=[16,24,32].flatMap(x=>[26,32,38].map(y=>`<circle cx="${x}" cy="${y}" r="2.4"/>`)).join('');
const IC={
logo:['#1f5f7a','<path d="M8 30c4-7 8-7 12 0s8 7 12 0 6-5 8-3" stroke="#d9efe8" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M8 19c4-7 8-7 12 0s8 7 12 0 6-5 8-3" stroke="#ff6b57" stroke-width="4" fill="none" stroke-linecap="round"/>'],
files:['#1f5f7a','<path d="M9 16a3 3 0 013-3h9l4 5h11a3 3 0 013 3v13a3 3 0 01-3 3H12a3 3 0 01-3-3z" fill="#ffd9a0"/><path d="M9 22h30v12a3 3 0 01-3 3H12a3 3 0 01-3-3z" fill="#ff6b57"/>'],
term:['#0e2433','<path d="M13 16l9 8-9 8" stroke="#7ff0c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 33h10" stroke="#ff6b57" stroke-width="4" stroke-linecap="round"/>'],
notes:['#e8d9b5','<rect x="12" y="9" width="24" height="30" rx="3" fill="#fff"/><path d="M17 18h14M17 24h14M17 30h8" stroke="#ff6b57" stroke-width="2.5" stroke-linecap="round"/>'],
calc:['#3a4a8a','<rect x="11" y="9" width="26" height="9" rx="2" fill="#d9efe8"/><g fill="#fff">'+dots+'</g>'],
paint:['#ff6b57','<path d="M24 9a15 15 0 100 30c3 0 4-2 3-4s0-4 3-4h4c3 0 5-2 5-5A15 15 0 0024 9z" fill="#fff4e0"/><circle cx="16" cy="22" r="3" fill="#1f5f7a"/><circle cx="24" cy="16" r="3" fill="#ffb02e"/><circle cx="33" cy="21" r="3" fill="#2bb673"/>'],
snake:['#123d2f','<path d="M12 36h10a5 5 0 000-10h-4a5 5 0 010-10h16" stroke="#7ff0c8" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="35" cy="16" r="2" fill="#ff6b57"/>'],
set:['#5b6b78','<circle cx="24" cy="24" r="11" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="4.3 4.3"/><circle cx="24" cy="24" r="7" fill="#fff"/><circle cx="24" cy="24" r="3" fill="#5b6b78"/>']};
const icon=id=>`<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="${IC[id][0]}"/>${IC[id][1]}</svg>`;

function ev2(s){let i=0;const ws=()=>{while(s[i]==' ')i++},
num=()=>{ws();if(s[i]=='('){i++;const v=add();ws();i++;return v}if(s[i]=='-'){i++;return -num()}const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]},
mul=()=>{let v=num();for(;;){ws();const c=s[i];if(c=='*'){i++;v*=num()}else if(c=='/'){i++;v/=num()}else return v}},
add=()=>{let v=mul();for(;;){ws();const c=s[i];if(c=='+'){i++;v+=mul()}else if(c=='-'){i++;v-=mul()}else return v}};
const r=add();ws();if(i<s.length)throw 0;return r}

function term(b){b.className+=' term';const i=H('input'),row=H('div','row');row.innerHTML='<span>'+cfg.user+'@marea:~$</span>';row.append(i);b.append(row);let hs=[],hi=0;
const p=t=>{const d=H('div');d.textContent=t;b.insertBefore(d,row);b.scrollTop=1e9};
const ids=Object.fromEntries(Object.entries(APPS).map(([k,v])=>[v.name.toLowerCase(),k]));
const C={ayuda:()=>p('ayuda  ls  cat <archivo>  touch <archivo>  rm <archivo>\necho <texto> > <archivo>  date  whoami  neofetch  apps  abrir <app>  clear  reiniciar'),
ls:()=>p(Object.keys(fs).join('   ')||'(vacío)'),cat:a=>p(fs[a[0]]??'cat: no existe '+a[0]),
touch:a=>{fs[a[0]]=fs[a[0]]||'';sv('fs',fs);fsev()},rm:a=>{delete fs[a[0]];sv('fs',fs);fsev()},
date:()=>p(new Date().toLocaleString('es-MX')),whoami:()=>p(cfg.user),apps:()=>p(Object.keys(ids).join('  ')),
clear:()=>[...b.querySelectorAll('div:not(.row)')].forEach(d=>d.remove()),reiniciar:()=>location.reload(),
abrir:a=>ids[(a[0]||'').toLowerCase()]?launch(ids[a[0].toLowerCase()]):p('No conozco esa app. Escribe “apps”.'),
neofetch:()=>p(`   .~~~~~~.     ${cfg.user}@marea\n ~~~~~~~~~~~~   SO: Marea OS 1.0\n  ~~~~~~~~~     Kernel: tu navegador\n   ~~~~~~       Shell: mareash\n                Archivos: ${Object.keys(fs).length}`)};
i.onkeydown=e=>{if(e.key=='ArrowUp'&&hs.length){i.value=hs[hi=Math.max(0,hi-1)]||'';e.preventDefault()}if(e.key!='Enter')return;const l=i.value.trim();i.value='';if(!l)return;hs.push(l);hi=hs.length;p(cfg.user+'@marea:~$ '+l);
const m=l.match(/^echo (.*?) > (\S+)$/);if(m){fs[m[2]]=m[1];sv('fs',fs);fsev();return}if(/^echo /.test(l))return p(l.slice(5));
const[c,...a]=l.split(/\s+/);(C[c]||(()=>p('mareash: comando no encontrado: '+c+' (prueba “ayuda”)')))(a)};
b.onclick=()=>i.focus();setTimeout(()=>i.focus(),50);p('Marea OS 1.0 — escribe “ayuda” para ver los comandos.')}

function files(b){b.className+=' files';const r=()=>{if(!b.isConnected)return document.removeEventListener('fs',r);b.innerHTML='';
const nw=H('div','fl','<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#ff6b57"/><path d="M24 13v22M13 24h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><br>Nuevo');nw.onclick=()=>launch('notes');b.append(nw);
Object.keys(fs).forEach(k=>{const f=H('div','fl',icon('notes')+'<br><span></span>');f.lastChild.textContent=k;f.onclick=()=>launch('notes',k);const u=H('u','','✕');u.title='Eliminar';u.onclick=e=>{e.stopPropagation();delete fs[k];sv('fs',fs);fsev()};f.append(u);b.append(f)})};document.addEventListener('fs',r);r()}

function notes(b,f){b.className+=' notes';const nm=H('input'),ta=H('textarea'),bt=H('button','pr','Guardar'),st=H('small');nm.placeholder='nombre.txt';nm.value=f||'';ta.value=f?fs[f]||'':'';ta.placeholder='Escribe aquí…';
bt.onclick=()=>{const k=nm.value.trim()||'sin-titulo.txt';nm.value=k;fs[k]=ta.value;sv('fs',fs);st.textContent='Guardado en '+k;fsev()};b.append(nm,ta,bt,st)}

function calc(b){b.className+=' calc';const o=H('output','','0'),g=H('div','pad');let e='';
'C ( ) ÷ 7 8 9 × 4 5 6 − 1 2 3 + 0 . ⌫ ='.split(' ').forEach(k=>{const x=H('button','',k);x.onclick=()=>{if(k=='C')e='';else if(k=='⌫')e=e.slice(0,-1);else if(k=='='){try{e=''+(+ev2(e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-')).toFixed(10))}catch(_){e='Error'}}else e=(e=='Error'?'':e)+k;o.textContent=e||'0'};g.append(x)});b.append(o,g)}

function paint(b){b.className+=' paint';let col='#0e2433',sz=6;const bar=H('div','bar'),c=H('canvas'),x=c.getContext('2d');
['#0e2433','#ff6b57','#ffb02e','#2bb673','#1f5f7a','#8a5ad6','#ffffff'].forEach(k=>{const s=H('button','sw');s.style.background=k;s.title=k=='#ffffff'?'Goma':'Color';s.onclick=()=>col=k;bar.append(s)});
const r=H('input'),cl=H('button','pr','Borrar todo');r.type='range';r.min=2;r.max=30;r.value=6;r.setAttribute('aria-label','Grosor');r.oninput=()=>sz=+r.value;
c.width=800;c.height=520;const wh=()=>{x.fillStyle='#fff';x.fillRect(0,0,800,520)};wh();cl.onclick=wh;bar.append(r,cl);b.append(bar,c);
let dr=0;const pt=e=>{const q=c.getBoundingClientRect();return[(e.clientX-q.left)*800/q.width,(e.clientY-q.top)*520/q.height]};
c.onpointerdown=e=>{dr=1;c.setPointerCapture(e.pointerId);const[a,y]=pt(e);x.beginPath();x.moveTo(a,y)};
c.onpointermove=e=>{if(!dr)return;const[a,y]=pt(e);x.strokeStyle=col;x.lineWidth=sz;x.lineCap=x.lineJoin='round';x.lineTo(a,y);x.stroke()};c.onpointerup=()=>dr=0}

function snake(b){b.className+=' snake';const c=H('canvas'),sc=H('small');c.width=c.height=300;b.append(c,sc);const x=c.getContext('2d'),N=15,K=20,w=b.closest('.win');let s,d,f,p,over;
const init=()=>{s=[[7,7],[6,7],[5,7]];d=[1,0];f=[11,4];p=0;over=0;sc.textContent='Puntos: 0 · usa las flechas o WASD'};init();
const h=e=>{if(!b.isConnected)return document.removeEventListener('keydown',h);if(!w.classList.contains('on'))return;
const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m&&(m[0]+d[0]||m[1]+d[1])){d=m;e.preventDefault()}if(over&&e.key==' ')init()};document.addEventListener('keydown',h);
const t=setInterval(()=>{if(!b.isConnected)return clearInterval(t);if(over)return;const n=[(s[0][0]+d[0]+N)%N,(s[0][1]+d[1]+N)%N];
if(s.some(q=>q[0]==n[0]&&q[1]==n[1])){over=1;sc.textContent='Fin · '+p+' puntos · pulsa espacio para reiniciar';return}
s.unshift(n);if(n[0]==f[0]&&n[1]==f[1]){p++;sc.textContent='Puntos: '+p;f=[Math.random()*N|0,Math.random()*N|0]}else s.pop();
x.fillStyle='#071820';x.fillRect(0,0,300,300);x.fillStyle='#ff6b57';x.beginPath();x.arc(f[0]*K+10,f[1]*K+10,8,0,7);x.fill();
s.forEach((q,i)=>{x.fillStyle=i?'#7ff0c8':'#d9efe8';x.fillRect(q[0]*K+1,q[1]*K+1,K-2,K-2)})},120)}

function sett(b){b.className+=' set';b.innerHTML='<label>Tu nombre<input maxlength="20"></label><p>Fondo de pantalla</p><div class="th"></div><button class="pr">Restablecer Marea OS</button><small>Marea OS 1.0 · hecho desde cero por Claude, en un solo archivo.</small>';
const i=$('input',b);i.value=cfg.user;i.onchange=()=>{cfg.user=i.value||'invitado';sv('cfg',cfg)};
TH.forEach((t,k)=>{const s=H('button');s.style.background=`linear-gradient(${t[0]},${t[2]})`;s.title='Fondo '+(k+1);s.onclick=()=>{cfg.theme=k;sv('cfg',cfg);setTheme(k)};$('.th',b).append(s)});
$('.pr',b).onclick=()=>{try{localStorage.clear()}catch(e){}location.reload()}}

const APPS={files:{name:'Archivos',w:460,h:340,run:files},term:{name:'Terminal',w:520,h:340,run:term},notes:{name:'Notas',w:420,h:360,run:notes},calc:{name:'Calculadora',w:280,h:380,run:calc},paint:{name:'Paint',w:540,h:400,run:paint},snake:{name:'Serpiente',w:340,h:380,run:snake},set:{name:'Ajustes',w:380,h:360,run:sett}};
let z=10,n=0;
function launch(id,arg){const A=APPS[id],w=H('div','win'),W=Math.min(A.w,innerWidth-16),Z=Math.min(A.h,innerHeight-100);
w.style.cssText=`width:${W}px;height:${Z}px;left:${Math.max(8,Math.min(60+(n*30)%240,innerWidth-W-8))}px;top:${24+(n++*26)%150}px`;
w.innerHTML=`<div class="tb"><i>${icon(id)}</i><b>${A.name}</b><button data-a="m" title="Minimizar">–</button><button data-a="x" title="Maximizar">▢</button><button data-a="c" title="Cerrar">✕</button></div><div class="bd"></div>`;
const t=H('button','tk',icon(id));t.title=A.name;$('#tasks').append(t);$('#desk').append(w);
const foc=()=>{w.classList.remove('min');document.querySelectorAll('.win,.tk').forEach(e=>e.classList.remove('on'));w.classList.add('on');t.classList.add('on');w.style.zIndex=++z};
const mn=()=>{w.classList.add('min');w.classList.remove('on');t.classList.remove('on')};
t.onclick=()=>w.classList.contains('on')&&!w.classList.contains('min')?mn():foc();w.onpointerdown=foc;
